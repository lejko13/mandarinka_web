# Po každom push na main postaví statický web (next build → out/) a zverejní ho na GitHub Pages.
name: Zverejniť web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Nastavenie GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # Web beží v podpriečinku repozitára, napr. /mandarinka_web
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Zverejnenie
        id: deployment
        uses: actions/deploy-pages@v5
